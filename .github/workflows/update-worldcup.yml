name: Actualizar Mundial 2026 (estable)

on:
  workflow_dispatch:
  schedule:
    # Solo se ejecuta durante los días finales del Mundial. El script además
    # ignora ejecuciones programadas fuera de 2026.
    - cron: "17 * 18-20 7 *"

permissions:
  contents: write

concurrency:
  group: mundial-calendar-public-update
  cancel-in-progress: true

jobs:
  update-calendar:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Actualizar calendario con fuentes públicas
        env:
          CALENDAR_FILE: "worldcup_calendar_2026.json"
          PUBLIC_CALENDAR_FILE: "public/worldcup_calendar_2026.json"
          SCRIPT_CALENDAR_FILE: "scripts/worldcup_calendar_2026.json"
          UPDATE_AFTER_MINUTES: "180"
          SOURCE_TIMEOUT_MS: "15000"
          SOURCE_RETRIES: "2"
          PUBLIC_SOURCE_URLS: "https://raw.githubusercontent.com/upbound-web/worldcup-live.json/master/2026/worldcup.json,https://raw.githubusercontent.com/openfootball/worldcup.json/master/2026/worldcup.json"
        run: node scripts/update-worldcup-public.js

      - name: Validar calendario y actualizador
        run: npm run check

      - name: Detectar cambios reales
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- worldcup_calendar_2026.json public/worldcup_calendar_2026.json scripts/worldcup_calendar_2026.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No hubo cambios reales." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Guardar cambios
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          branch="${GITHUB_REF_NAME:-main}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worldcup_calendar_2026.json public/worldcup_calendar_2026.json scripts/worldcup_calendar_2026.json
          git commit -m "Actualizar calendario Mundial 2026"

          # Evita rechazos por cambios subidos mientras corría la acción.
          git pull --rebase origin "$branch"

          # Un problema de permisos no debe producir correos de error cada hora.
          # Queda visible como advertencia en el resumen de la ejecución.
          if git push origin "HEAD:$branch"; then
            echo "Calendario actualizado correctamente." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub rechazó el push. Revisa Settings > Actions > General > Workflow permissions y habilita Read and write permissions."
            echo "El calendario se generó y validó, pero GitHub rechazó el push por permisos." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
