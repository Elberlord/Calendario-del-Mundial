name: Actualizar Mundial sin API key

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: mundial-calendar-public-update
  cancel-in-progress: true

jobs:
  update-calendar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repo
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Actualizar calendario con fuentes publicas
        env:
          CALENDAR_FILE: "worldcup_calendar_2026.json"
          PUBLIC_CALENDAR_FILE: "public/worldcup_calendar_2026.json"
          SCRIPT_CALENDAR_FILE: "scripts/worldcup_calendar_2026.json"
          UPDATE_AFTER_MINUTES: "180"
          PUBLIC_SOURCE_URLS: "https://worldcup26.ir/get/games,https://raw.githubusercontent.com/upbound-web/worldcup-live.json/master/2026/worldcup.json,https://raw.githubusercontent.com/openfootball/worldcup.json/master/2026/worldcup.json"
        run: node scripts/update-worldcup-public.js

      - name: Guardar cambios si hubo actualizacion
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add worldcup_calendar_2026.json public/worldcup_calendar_2026.json scripts/worldcup_calendar_2026.json
          git commit -m "Actualizar calendario mundial desde fuente publica" || echo "Sin cambios para guardar"
          git push
